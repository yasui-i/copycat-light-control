import groovy.json.JsonOutput
import groovy.json.JsonSlurper

allprojects {
    afterEvaluate {
        if (!project.hasProperty('clientSmoke')) return
        sourceSets.main.java.srcDir('src/clientSmoke/java')
        neoForge.runs.named('client') {
            systemProperty 'copycat_light_control.clientSmoke', 'true'
            gameDirectory = project.layout.projectDirectory.dir('run-client-smoke')
            programArguments.addAll('--width', '320', '--height', '240')
        }
        tasks.named('processResources') {
            doLast {
                def config = destinationDir.toPath().resolve('copycat_light_control.mixins.json').toFile()
                def json = new JsonSlurper().parse(config)
                def names = json.client ?: []
                if (!names.contains('client.SmokeWindowMixin')) names.add('client.SmokeWindowMixin')
                json.client = names
                config.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
            }
        }
        tasks.named('jar') {
            doFirst { throw new GradleException('Client smoke classes must never enter a release JAR.') }
        }
    }
}
