allprojects {
    afterEvaluate {
        if (project.hasProperty('lightSmoke')) {
            neoForge.runs.named('server') {
                gameDirectory = project.layout.projectDirectory.dir('run-smoke')
            }
        }
        configurations.named('neoForgeConfigOnly') {
            dependencies.clear()
            dependencies.add(project.dependencies.create(project.files('build/moddev-config.json')))
        }
    }
}
